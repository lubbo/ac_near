[ABOUT]
NAME = Near
AUTHOR = Lubbo
VERSION = 1.2.0
DESCRIPTION = Displays the driver immediately ahead and behind in standings with lap times and gaps.

[CORE]
; FULL = unloads script completely when window is closed
LAZY = FULL

[WINDOW_0]
ID = main
NAME = Near
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
SIZE = 300, 300          ; initial size, user can resize
FLAGS =  AUTO_RESIZE, NO_BACKGROUND, NO_COLLAPSE, NO_SCROLLBAR, SETTINGS    ; transparent, no background frame
PADDING = 0, 0

